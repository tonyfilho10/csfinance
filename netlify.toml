[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "nft"
  # Plano free: 10s | Plano Pro: até 26s
  # Com Haiku + 10 tx por batch ficamos bem abaixo dos 10s
  timeout = 26
